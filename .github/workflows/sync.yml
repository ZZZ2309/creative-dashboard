name: 同步 Vika 数据

# 触发条件：
#   1) 定时：每 10 分钟自动从 Vika 拉取最新数据并生成 data.json
#   2) 手动：在 Actions 页面点 "Run workflow" 立即同步
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# 允许工作流向仓库写回（提交 data.json）
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 拉取 Vika 并生成 data.json
        env:
          VIKA_TOKEN: ${{ secrets.VIKA_TOKEN }}
          VIKA_DATASHEET_ID: dstgba1BmVH0Pc8s61
        run: node fetch_vika.mjs

      - name: 提交更新（仅当有变化）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 自动同步 Vika 数据 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
